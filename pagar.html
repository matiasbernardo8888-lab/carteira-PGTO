<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Acesso INVEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-yellow-400">Acesso INVEST</h1>
                <p class="text-gray-400 mt-2">Libere sua carteira por R$ 44,90</p>
            </div>

            <div id="step1">
                <p class="text-center text-gray-300 mb-6">1. Copie o código Pix abaixo</p>
                <button onclick="copiarPix()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                    <i data-lucide="copy"></i> Copiar Código Pix R$ 44,90
                </button>
                <p class="text-center text-gray-300 my-6">2. Pague no seu app do banco</p>
                <button onclick="mostrarStep2()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                    <i data-lucide="check-circle"></i> Já Paguei
                </button>
            </div>

            <div id="step2" class="hidden">
                <div class="bg-blue-900/50 border border-blue-700 rounded-lg p-6 text-center">
                    <i data-lucide="shield-check" class="w-12 h-12 text-blue-400 mx-auto mb-4"></i>
                    <h2 class="text-xl font-bold mb-2">Pagamento Realizado?</h2>
                    <p class="text-gray-300 mb-4">Envie o comprovante no WhatsApp para receber seu link de acesso exclusivo.</p>
                    <a href="https://wa.me/55SEUNUMERO?text=Olá, acabei de pagar o Acesso INVEST. Segue comprovante:" 
                       target="_blank"
                       class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                        <i data-lucide="message-circle"></i> Enviar Comprovante no WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg">
        Código Pix copiado!
    </div>

<script>
    lucide.createIcons();
    
    const PIX_COPIA_COLA = "00020101021126580014br.gov.bcb.pix0136bee17ddb-eaf7-4f23-b50e-b35da280cd5d520400005303986540544.905802BR5920BERNARDO M B PEREIRA6013BELO HORIZONT62070503***63048363";
    
    function copiarPix() { 
        navigator.clipboard.writeText(PIX_COPIA_COLA); 
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    function mostrarStep2() {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }
</script>
</body>
</html>
