.card:hover{border-color:rgba(246,204,96,.22)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;color:#001018;background:linear-gradient(135deg,${k.cyan},${k.blue});transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(246,204,96,.28)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn2{background:transparent;color:${k.cyan};border:1px solid rgba(246,204,96,.45);border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;transition:background .15s}
.btn2:hover{background:rgba(246,204,96,.1)}
.ghost{background:transparent;border:1px solid ${k.line};color:${k.dim};border-radius:10px;padding:9px 14px;font-size:13px}
.ghost:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid ${k.line};border-radius:10px;color:#fff;padding:11px 13px;font-size:14px;outline:none;transition:border-color .15s}
.inp:focus{border-color:rgba(246,204,96,.55)}
.inp::placeholder{color:${k.faint}}
select.inp option{background:#0F1018}
.lbl{display:block;font-size:12px;color:${k.dim};margin-bottom:6px;font-weight:500}
.chip{border:1px solid ${k.line};background:transparent;color:${k.dim};border-radius:999px;padding:6px 13px;font-size:12px;font-weight:500}
.chip.on{color:${k.cyan};border-color:rgba(246,204,96,.5);background:rgba(246,204,96,.1)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.badge i{width:6px;height:6px;border-radius:50%;display:inline-block}
.row{display:grid;align-items:center;padding:13px 16px;border-bottom:1px solid ${k.line};font-size:14px}
.row:last-child{border-bottom:0}
.th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:${k.faint};font-weight:600}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,204,96,.45)}50%{box-shadow:0 0 0 12px rgba(246,204,96,0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:${k.bg};position:relative;padding:0 18px 104px}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.ico{background:transparent;border:0;color:${k.cyan};width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.ico:hover{background:rgba(246,204,96,.1)}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:center;padding:14px 12px 20px;background:${k.bg};border-top:1px solid #24212A;z-index:50}
.bnav button{background:transparent;border:0;color:#fff;width:52px;height:44px;display:grid;place-items:center;border-radius:12px}
.bnav button.on{color:${k.cyan}}
.drawer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6)}
.drawer>div{width:270px;height:100%;background:${k.bg};border-right:1px solid ${k.line};padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.pill{display:inline-flex;align-items:center;gap:12px;border:0;background:${k.cyan};color:#1A171E;font-weight:600;font-size:16px;border-radius:14px;padding:11px 16px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#25222B;border:1px solid ${k.line};border-radius:12px;padding:6px;z-index:20;min-width:100%}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#fff;padding:10px 12px;border-radius:8px;font-size:14px}
.menu button:hover,.menu button.on{background:rgba(246,204,96,.12);color:${k.cyan}}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid ${k.line};background:${k.bg2};padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:${k.dim};font-size:14px;font-weight:500;text-align:left;width:100%}
.nav:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav.on{color:${k.cyan};background:rgba(246,204,96,.1)}
.main{padding:28px 32px 64px;max-width:1180px;width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;max-width:1120px;margin:0 auto;padding:0 28px;width:100%}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:50;border-right:0;border-top:1px solid ${k.line}}
 .side .brand,.side .foot{display:none}
 .nav{flex-direction:column;gap:3px;font-size:10px;padding:8px 10px;min-width:64px;text-align:center}
 .main{padding:20px 16px 96px}
 .grid4{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:1fr}
 .hero{grid-template-columns:1fr;gap:28px;padding:24px 20px}
 .hide-m{display:none!important}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
